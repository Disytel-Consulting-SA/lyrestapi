get:
  summary: Retorna la lista de categorias de asiento contable
  tags:
    - "glcategory"
  description: >
    Retorna la lista de categorias de asiento contable. Recurso de solo lectura: el mantenimiento se hace desde Libertya.
    Su id se envia como gl_category_id en la cabecera del asiento.
  operationId: getAllGLCategories
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/glcategory.yaml#/components/schemas/GLCategory'
