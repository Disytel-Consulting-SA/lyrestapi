      description: ID del lenguaje
      required: true
      schema:
        type: string
  description: Recupera la informacion de una traduccion de tabla en particular
  operationId: retrieveTableTrl
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/tabletrl.yaml#/components/schemas/TableTrl'