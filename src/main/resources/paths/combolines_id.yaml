get:
  summary: Recupera una linea de combo en particular
  tags:
    - "comboline"
  parameters:
    - name: id
      in: path
      description: ID de la linea de combo
      required: true
      schema:
        type: integer
  description: Recupera la informacion de una linea de combo en particular
  operationId: retrieveComboLine
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/comboline.yaml#/components/schemas/ComboLine'
delete:
  summary: Elimina una linea de combo
  tags:
    - "comboline"
  parameters:
    - name: id
      in: path
      description: ID de la linea de combo
      required: true
      schema:
        type: integer
  description: Elimina una linea de combo existente
  operationId: deleteComboLine
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza por completo una linea de combo existente
  tags:
    - "comboline"
  operationId: updateComboLine
  parameters:
    - name: id
      in: path
      description: ID de la linea de combo a actualizar
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/comboline.yaml#/components/schemas/ComboLine'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
