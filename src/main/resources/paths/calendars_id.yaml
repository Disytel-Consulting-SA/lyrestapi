get:
  summary: Recupera un calendario en particular
  tags:
    - "calendar"
  parameters:
    - name: id
      in: path
      description: ID del calendario
      required: true
      schema:
        type: integer
  description: Recupera la informacion de un calendario en particular
  operationId: retrieveCalendar
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/calendar.yaml#/components/schemas/Calendar'
delete:
  summary: Elimina un calendario
  tags:
    - "calendar"
  parameters:
    - name: id
      in: path
      description: ID de calendario
      required: true
      schema:
        type: integer
  description: Elimina un calendario existente
  operationId: deleteCalendar
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza por completo un calendario existente
  tags:
    - "calendar"
  operationId: updateCalendar
  parameters:
    - name: id
      in: path
      description: ID del calendario a actualizar
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/calendar.yaml#/components/schemas/Calendar'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string