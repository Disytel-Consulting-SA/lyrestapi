get:
  summary: Recupera el esquema completo de metadatos de una ventana
  description: Recupera la estructura de metadatos necesaria para construir dinámicamente una ventana, incluyendo sus pestañas, tablas, campos y columnas asociadas.
  tags:
    - "windowschema"
  parameters:
    - name: id
      in: path
      description: ID de la ventana
      required: true
      schema:
        type: integer
    - name: language
      in: query
      description: Idioma de traducción solicitado
      required: false
      schema:
        type: string
        default: es_AR
  operationId: retrieveWindowSchema
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/windowschema.yaml#/components/schemas/WindowSchema'