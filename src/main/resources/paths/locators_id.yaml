get:
  summary: Recupera una ubicacion de almacen en particular
  tags:
    - "locator"
  parameters:
    - name: id
      in: path
      description: ID de la ubicacion de almacen
      required: true
      schema:
        type: integer
  description: Recupera la informacion de una ubicacion de almacen en particular
  operationId: retrieveLocator
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/locator.yaml#/components/schemas/Locator'
delete:
  summary: Elimina una ubicacion de almacen
  tags:
    - "locator"
  parameters:
    - name: id
      in: path
      description: ID de la ubicacion de almacen
      required: true
      schema:
        type: integer
  description: Elimina una ubicacion de almacen existente
  operationId: deleteLocator
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza por completo una ubicacion de almacen existente
  tags:
    - "locator"
  operationId: updateLocator
  parameters:
    - name: id
      in: path
      description: ID de la ubicacion de almacen a actualizar
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/locator.yaml#/components/schemas/Locator'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
