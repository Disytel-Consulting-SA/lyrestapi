get:
  summary: Retorna la lista de asociaciones usuario-perfil
  tags:
    - "userrole"
  description: Retorna la lista completa de asociaciones usuario-perfil
  operationId: getAllUserRoles
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/userrole.yaml#/components/schemas/UserRole'
post:
  summary: Nueva asociacion usuario-perfil
  tags:
    - "userrole"
  description: Agrega una nueva asociacion usuario-perfil
  operationId: addUserRole
  responses:
    "200":
      description: OK. ID de la asociacion creado es retornada, el cual es formada por su ID de Usuario y ID de Perfil
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible insertar
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/userrole.yaml#/components/schemas/UserRole'
