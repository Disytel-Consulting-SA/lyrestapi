get:
  summary: Retorna la lista de ubicaciones de almacen
  tags:
    - "locator"
  description: Retorna la lista completa de ubicaciones de almacen
  operationId: getAllLocators
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/locator.yaml#/components/schemas/Locator'
post:
  summary: Nueva ubicacion de almacen
  tags:
    - "locator"
  description: Agrega una nueva ubicacion de almacen
  operationId: addLocator
  responses:
    "200":
      description: OK. ID de la ubicacion de almacen es retornado
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible insertar
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/locator.yaml#/components/schemas/Locator'
