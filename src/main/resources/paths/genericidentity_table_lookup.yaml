post:
  tags:
    - genericidentity
  summary: Recupera un registro por su identidad completa
  operationId: retrieveGenericRecordByIdentity
  parameters:
    - in: path
      name: table
      required: true
      schema:
        type: string
    - in: query
      name: fields
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../model/genericrecord.yaml#/components/schemas/GenericRecord'
  responses:
    "200":
      description: Registro recuperado
      content:
        application/json:
          schema:
            $ref: '../model/genericrecord.yaml#/components/schemas/GenericRecord'
    "403":
      description: Acceso denegado
    "404":
      description: Tabla o registro no encontrado
    "409":
      description: Identidad u operacion invalida
