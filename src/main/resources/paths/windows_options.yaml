get:
  summary: Recupera las ventanas disponibles para selección
  description: >
    Recupera una lista liviana de ventanas con su nombre traducido
    según el idioma solicitado.
  tags:
    - "windowoptions"

  parameters:
    - name: language
      in: query
      description: Idioma solicitado
      required: false
      schema:
        type: string
        default: es_AR

  operationId: retrieveWindowOptions

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/windowoption.yaml#/components/schemas/WindowOption'