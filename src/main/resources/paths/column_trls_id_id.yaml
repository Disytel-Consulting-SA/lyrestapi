get:
  summary: Recupera una traduccion de columna en particular
  tags:
    - "columntrl"
  parameters:
    - name: idColumn
      in: path
      description: ID de la columna
      required: true
      schema:
        type: integer
    - name: idLanguage
      in: path
      description: ID del lenguaje
      required: true
      schema:
        type: string
  description: Recupera la informacion de una traduccion de columna en particular
  operationId: retrieveColumnTrl
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/columntrl.yaml#/components/schemas/ColumnTrl'