get:
  tags:
    - "journalline"
  summary: Recupera una linea de asiento contable en particular
  parameters:
    - name: id
      in: path
      description: ID de la linea de asiento contable
      required: true
      schema:
        type: integer
  description: Recupera la informacion de una linea de asiento contable en particular
  operationId: retrieveJournalLine
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/journalline.yaml#/components/schemas/JournalLine'
delete:
  tags:
    - "journalline"
  summary: Elimina una linea de asiento contable
  parameters:
    - name: id
      in: path
      description: ID de la linea de asiento contable
      required: true
      schema:
        type: integer
  description: >
    Elimina una linea de asiento contable existente. Solo es posible mientras el asiento este en borrador.
    Los totales de la cabecera se recalculan solos.
  operationId: deleteJournalLine
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  tags:
    - "journalline"
  summary: Actualiza una linea de asiento contable existente
  description: >
    Actualiza una linea de asiento contable en borrador. Los totales de la cabecera se recalculan solos.
  operationId: updateJournalLine
  parameters:
    - name: id
      in: path
      description: ID de la linea de asiento contable a actualizar
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/journalline.yaml#/components/schemas/JournalLine'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
