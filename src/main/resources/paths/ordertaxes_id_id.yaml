get:
  summary: Recupera un impuesto de pedido en particular
  tags:
    - "ordertax"
  parameters:
    - name: idOrder
      in: path
      description: ID de pedido
      required: true
      schema:
        type: integer
    - name: idTax
      in: path
      description: ID del impuesto
      required: true
      schema:
        type: integer
  description: Recupera la informacion del impusto de pedido en particular
  operationId: retrieveOrderTax
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/ordertax.yaml#/components/schemas/OrderTax'
delete:
  summary: Elimina un impuesto de pedido
  tags:
    - "ordertax"
  parameters:
    - name: idOrder
      in: path
      description: ID de pedido
      required: true
      schema:
        type: integer
    - name: idTax
      in: path
      description: ID de impuesto
      required: true
      schema:
        type: integer
  description: Elimina un impuesto de pedido
  operationId: deleteOrderTax
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza un impuesto de pedido existente
  tags:
    - "ordertax"
  operationId: updateOrderTax
  parameters:
    - name: idOrder
      in: path
      description: ID de pedido
      required: true
      schema:
        type: integer
    - name: idTax
      in: path
      description: ID de impuesto
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/ordertax.yaml#/components/schemas/OrderTax'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string