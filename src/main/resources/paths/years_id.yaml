get:
  summary: Recupera un año en particular
  tags:
    - "year"
  parameters:
    - name: id
      in: path
      description: ID del año
      required: true
      schema:
        type: integer
  description: Recupera la informacion de un año en particular
  operationId: retrieveYear
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/year.yaml#/components/schemas/Year'
delete:
  summary: Elimina un año
  tags:
    - "year"
  parameters:
    - name: id
      in: path
      description: ID de año
      required: true
      schema:
        type: integer
  description: Elimina un año existente
  operationId: deleteYear
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza por completo un año existente
  tags:
    - "year"
  operationId: updateYear
  parameters:
    - name: id
      in: path
      description: ID del año a actualizar
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/year.yaml#/components/schemas/Year'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string