      description: ID del lenguaje
      required: true
      schema:
        type: string
  description: Recupera la informacion de una traduccion de proceso en particular
  operationId: retrieveProcessTrl
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/processtrl.yaml#/components/schemas/ProcessTrl'