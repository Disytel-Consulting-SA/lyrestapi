post:
  tags:
    - "inoutheader"
  summary: Nueva cabecera de remito
  description: Agrega una nueva cabecera de remito
  operationId: addInOutHeader
  responses:
    "200":
      description: OK. ID de remito creado es retornado
      content:
        text/plain:
          schema:
            type: string
