get:
  summary: Retorna la lista de traducciones de mensajes
  tags:
    - "messagetrl"
  description: Retorna la lista completa de traducciones de mensajes
  operationId: getAllMessageTrls
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/messagetrl.yaml#/components/schemas/MessageTrl'