get:
  summary: Retorna la lista de esquemas contables
  tags:
    - "acctschema"
  description: >
    Retorna la lista de esquemas contables. Recurso de solo lectura: el mantenimiento se hace desde Libertya.
    Define la moneda y las reglas de contabilizacion. Su id se envia como c_acctschema_id en la cabecera del asiento.
  operationId: getAllAcctSchemas
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/acctschema.yaml#/components/schemas/AcctSchema'
