get:
  summary: Retorna la lista de combinaciones contables
  tags:
    - "validcombination"
  description: >
    Retorna la lista de combinaciones contables. Recurso de solo lectura: el mantenimiento se hace desde Libertya.
    Una combinacion es cuenta mas dimensiones analiticas (organizacion, producto, entidad comercial, proyecto, campania). Solo hace falta consultarlas para imputar con dimensiones: para un asiento sin dimensiones alcanza con enviar c_elementvalue_id en la linea y el modelo resuelve la combinacion solo. Las combinaciones se crean por demanda, con lo cual una cuenta a la que nunca se imputo puede no tener ninguna.
  operationId: getAllValidCombinations
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/validcombination.yaml#/components/schemas/ValidCombination'
