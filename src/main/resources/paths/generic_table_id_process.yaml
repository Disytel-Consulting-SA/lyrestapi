put:
  tags:
    - "generic"
  summary: Procesa un documento de una tabla
  description: >
    Aplica una accion de documento sobre un registro de una tabla cuyo modelo implementa DocAction. Sobre una
    tabla que no es un documento responde 409.


    ACCIONES SOPORTADAS: actualmente CO (completar), VO (anular) y CL (cerrar). Otras acciones que CORE pueda
    considerar validas no estan disponibles todavia debido a que el procesamiento generico actual presupone que
    el DocStatus resultante coincide con el DocAction solicitado. Ver docs/PENDIENTES.md P1.
  operationId: processGenericRecord
  parameters:
    - in: path
      name: table
      description: Nombre de la tabla (TableName de AD_Table), por ejemplo GL_Journal
      required: true
      schema:
        type: string
    - in: path
      name: id
      description: Valor de la clave primaria del documento a procesar
      required: true
      schema:
        type: integer
    - in: query
      name: action
      required: true
      description: "Accion a aplicar. Valores validos: CO (completar), VO (anular), CL (cerrar)"
      schema:
        type: string
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible procesar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: La tabla o el documento no existen
      content:
        text/plain:
          schema:
            type: string
