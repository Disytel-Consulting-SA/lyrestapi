get:
  summary: Recupera una asociacion usuario-perfil en particular
  tags:
    - "userrole"
  parameters:
    - name: idUser
      in: path
      description: ID del usuario
      required: true
      schema:
        type: integer
    - name: idRole
      in: path
      description: ID del perfil
      required: true
      schema:
        type: integer
  description: Recupera la informacion de una asociacion usuario-perfil
  operationId: retrieveUserRole
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: '../model/userrole.yaml#/components/schemas/UserRole'
delete:
  summary: Elimina una asociacion usuario-perfil
  tags:
    - "userrole"
  parameters:
    - name: idUser
      in: path
      description: ID del usuario
      required: true
      schema:
        type: integer
    - name: idRole
      in: path
      description: ID del perfil
      required: true
      schema:
        type: integer
  description: Elimina una asociacion usuario-perfil
  operationId: deleteUserRole
  responses:
    "409":
      description: Imposible eliminar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string
    "204":
      description: OK
      content:
        text/plain:
          schema:
            type: string
put:
  summary: Actualiza una asociacion usuario-perfil
  tags:
    - "userrole"
  operationId: updateUserRole
  parameters:
    - name: idUser
      in: path
      description: ID del usuario
      required: true
      schema:
        type: integer
    - name: idRole
      in: path
      description: ID del perfil
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/userrole.yaml#/components/schemas/UserRole'
  responses:
    "200":
      description: OK
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible actualizar
      content:
        text/plain:
          schema:
            type: string
    "404":
      description: No encontrado
      content:
        text/plain:
          schema:
            type: string