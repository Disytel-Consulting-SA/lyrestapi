get:
  summary: Retorna la lista de periodos contables
  tags:
    - "period"
  description: >
    Retorna la lista de periodos contables. Recurso de solo lectura: el mantenimiento se hace desde Libertya.
    Permite verificar que el periodo correspondiente a la fecha contable del asiento este abierto antes de enviarlo, y asi evitar un 409 por periodo cerrado.
  operationId: getAllPeriods
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/period.yaml#/components/schemas/Period'
