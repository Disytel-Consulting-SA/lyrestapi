get:
  summary: Retorna las filas de retenciones sufridas de la liquidacion
  tags:
    - "withholdingsettlement"
  description: >
    Retorna las filas de retenciones sufridas de la liquidacion de una liquidacion de tarjetas.


    NO HACE FALTA CREARLAS. Al crear la cabecera, el modelo ejecuta generateAllChildrens() y deja una fila en
    cero por cada concepto activo del maestro correspondiente. Una fila por cada esquema de retencion sufrida activo. El concepto se identifica por c_retencionschema_id,
    que se resuelve con GET /v1.0/retencionschemas?filter=retencionapplication='S'.


    El uso normal es listar las filas de una liquidacion para saber que concepto es cada una, y despues cargar
    el importe con PUT /v1.0/withholdingsettlements/{id}:


        GET /v1.0/withholdingsettlements?filter=c_creditcardsettlement_id=1234


    Cuelgan directo de C_CreditCardSettlement, no del filtro de cupones.
  operationId: getAllWithholdingSettlements
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/withholdingsettlement.yaml#/components/schemas/WithholdingSettlement'
