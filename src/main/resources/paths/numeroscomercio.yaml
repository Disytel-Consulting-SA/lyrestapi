get:
  summary: Retorna la lista de numeros de comercio
  tags:
    - "numerocomercio"
  description: >
    Retorna la lista de numeros de comercio. Recurso de solo lectura: el mantenimiento se hace desde Libertya.
    Es el maestro que resuelve, para una liquidacion de tarjetas, la entidad comercial (c_bpartner_id) contra la
    que se emite y las cuentas bancarias asociadas. El c_bpartner_id NO se deduce del adquirente: un mismo
    adquirente puede operar contra varias entidades comerciales segun el comercio.
    Tabla exclusiva del diccionario de Tehuelche.
  operationId: getAllNumerosComercio
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/numerocomercio.yaml#/components/schemas/NumeroComercio'
