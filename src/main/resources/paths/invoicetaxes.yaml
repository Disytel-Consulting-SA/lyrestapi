get:
  tags:
    - "invoicetax"
  summary: Retorna impuestos de factura
  description: Retorna una lista de impuestos de  facturas
  operationId: getAllInvoiceTaxes
  parameters:
    - in: query
      name: filter
      schema:
        type: string
      description: Criterio de filtrado
    - in: query
      name: fields
      schema:
        type: string
      description: Campos a recuperar
    - in: query
      name: sort
      schema:
        type: string
      description: Criterio de ordenado
    - in: query
      name: limit
      schema:
        type: integer
      description: Limite de elementos a retornar por pagina
    - in: query
      name: page
      schema:
        type: integer
      description: Numero de pagina
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../model/invoicetax.yaml#/components/schemas/InvoiceTax'
post:
  tags:
    - "invoicetax"
  summary: Nuevo impuesto de factura
  description: Agrega un nuevo impuesto de factura
  operationId: addInvoiceTax
  responses:
    "200":
      description: OK. ID del impuesto de factura creado es retornado, el cual es formato por su ID de Factura y ID de Tax
      content:
        text/plain:
          schema:
            type: string
    "409":
      description: Imposible insertar
      content:
        text/plain:
          schema:
            type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../model/invoicetax.yaml#/components/schemas/InvoiceTax'
