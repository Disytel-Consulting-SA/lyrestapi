components:
  schemas:
    Period:
      type: object
      properties:
        ad_client_id:
          type: integer
          description: "Compañía o empresa que utiliza ésta instalación"
        ad_org_id:
          type: integer
          description: "Entidad organizacional dentro de la compañía"
        c_period_id:
          type: integer
          description: "Período de Calendario"
        created:
          type: string
          description: "Fecha de creación de este registro"
        createdby:
          type: integer
          description: "Usuario que creó este registro"
        c_year_id:
          type: integer
          description: "Año del calendario"
        enddate:
          type: string
          description: "Última fecha efectiva (inclusive)"
        isactive:
          type: boolean
          description: "El registro está activo en el sistema"
        name:
          type: string
          description: "Identificador alfanumérico de la Entidad"
        periodno:
          type: integer
          description: "Número de Período único"
        periodtype:
          type: string
          description: "Tipo de período"
        startdate:
          type: string
          description: "Primer día efectivo (inclusive)"
        updated:
          type: string
          description: "Determina si el campo esta actualizado"
        updatedby:
          type: integer
          description: "Determina quien actualizó el campo"
        additionalvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
        referencedvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
      required:
         - ad_client_id
         - ad_org_id
         - c_period_id
         - created
         - createdby
         - c_year_id
         - isactive
         - name
         - periodno
         - periodtype
         - startdate
         - updated
         - updatedby
