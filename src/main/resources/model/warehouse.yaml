components:
  schemas:
    Warehouse:
      type: object
      properties:
        ad_client_id:
          type: integer
          description: "Compañía o empresa que utiliza ésta instalación"
        ad_componentobjectuid:
          type: string
          description: " "
        ad_org_id:
          type: integer
          description: "Entidad organizacional dentro de la compañía"
        c_location_id:
          type: integer
          description: "Ubicación o Dirección"
        created:
          type: string
          description: "Fecha de creación de este registro"
        createdby:
          type: integer
          description: "Usuario que creó este registro"
        description:
          type: string
          description: "Descripción corta opcional del registro"
        isactive:
          type: boolean
          description: "El registro está activo en el sistema"
        m_warehouse_id:
          type: integer
          description: "Almacén"
        name:
          type: string
          description: "Identificador alfanumérico de la Entidad"
        productchangecharge_id:
          type: integer
          description: "Cargo asociado a las líneas del inventario generado por un cambio de artículo"
        separator:
          type: string
          description: "Separador de los Elementos de la cuenta"
        shrink_charge_id:
          type: integer
          description: "Cargo utilizado para contabilizar mermas de artículos"
        splitting_charge_id:
          type: integer
          description: "Cargo utilizado para contabilizar altas/bajas de artículos por fraccionamientos"
        stockavailableforsale:
          type: boolean
          description: " "
        updated:
          type: string
          description: "Determina si el campo esta actualizado"
        updatedby:
          type: integer
          description: "Determina quien actualizó el campo"
        value:
          type: string
          description: "Clave de búsqueda para el registro en el formato requerido; debe ser única"
        additionalvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
        referencedvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
      required:
         - ad_client_id
         - ad_org_id
         - c_location_id
         - created
         - createdby
         - isactive
         - m_warehouse_id
         - name
         - separator
         - stockavailableforsale
         - updated
         - updatedby
         - value
