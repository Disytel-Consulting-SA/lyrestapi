components:
  schemas:
    Warehouse:
      type: object
      properties:
        ad_client_id:
          type: integer
          description: "Compañía o empresa que utiliza ésta instalación"
        ad_componentobjectuid:
          type: string
          description: "Identificador unico universal del objeto"
        ad_org_id:
          type: integer
          description: "Entidad organizacional dentro de la compañía"
        c_location_id:
          type: integer
          description: "Ubicación o dirección física"
        created:
          type: string
          description: "Fecha de creación de este registro"
        createdby:
          type: integer
          description: "Usuario que creó este registro"
        description:
          type: string
          description: "Descripción corta opcional del registro"
        isactive:
          type: boolean
          description: "El registro está activo en el sistema"
        m_warehouse_id:
          type: integer
          description: "Almacén"
        name:
          type: string
          description: "Identificador alfanumérico de la Entidad"
        productchangecharge_id:
          type: integer
          description: "Cargo asociado al cambio de producto"
        separator:
          type: string
          description: "Separador del elemento"
        shrink_charge_id:
          type: integer
          description: "Cargo asociado a la merma"
        splitting_charge_id:
          type: integer
          description: "Cargo asociado al fraccionamiento"
        updated:
          type: string
          description: "Determina si el campo esta actualizado"
        updatedby:
          type: integer
          description: "Determina quien actualizó el campo"
        value:
          type: string
          description: "Clave de búsqueda para el registro en el formato requerido; debe ser única"
        additionalvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
        referencedvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
      required:
         - ad_client_id
         - ad_org_id
         - c_location_id
         - created
         - createdby
         - isactive
         - m_warehouse_id
         - name
         - updated
         - updatedby
         - value
