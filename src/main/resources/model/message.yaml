components:
  schemas:
    Message:
      type: object
      properties:
        ad_client_id:
          type: integer
          description: "Compañía o empresa que utiliza ésta instalación"
        ad_componentobjectuid:
          type: string
          description: " "
        ad_componentversion_id:
          type: integer
          description: "Versión de Componente propietaria de este registro"
        ad_message_id:
          type: integer
          description: "Mensaje del Sistema"
        ad_org_id:
          type: integer
          description: "Entidad organizacional dentro de la compañía"
        created:
          type: string
          description: "Fecha de creación de este registro"
        createdby:
          type: integer
          description: "Usuario que creó este registro"
        entitytype:
          type: string
          description: "Tipo de Entidad Diccionario; determina propiedad y sincronización"
        isactive:
          type: boolean
          description: "El registro está activo en el sistema"
        msgtext:
          type: string
          description: "Texto Informativo; Menú o Mensaje de Error"
        msgtip:
          type: string
          description: "Sugerencia Adicional o ayuda para este mensaje"
        msgtype:
          type: string
          description: "Tipo de mensaje (Informativo; Menú o Error)"
        updated:
          type: string
          description: "Determina si el campo esta actualizado"
        updatedby:
          type: integer
          description: "Determina quien actualizó el campo"
        value:
          type: string
          description: "Clave de búsqueda para el registro en el formato requerido; debe ser única"
        additionalvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
        referencedvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
      required:
         - ad_client_id
         - ad_message_id
         - ad_org_id
         - created
         - createdby
         - entitytype
         - isactive
         - msgtext
         - msgtype
         - updated
         - updatedby
         - value
