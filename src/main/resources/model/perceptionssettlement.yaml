components:
  schemas:
    PerceptionsSettlement:
      type: object
      properties:
        ad_client_id:
          type: integer
          description: "Compañía o empresa que utiliza ésta instalación"
        ad_org_id:
          type: integer
          description: "Entidad organizacional dentro de la compañía"
        amount:
          type: number
          description: "Importe en una moneda definida"
        c_creditcardsettlement_id:
          type: integer
          description: "Liquidaciones de Tarjetas de Crédito"
        c_perceptionssettlement_id:
          type: integer
          description: " "
        created:
          type: string
          description: "Fecha de creación de este registro"
        createdby:
          type: integer
          description: "Usuario que creó este registro"
        c_tax_id:
          type: integer
          description: "Identificador del Impuesto"
        internalno:
          type: string
          description: " "
        isactive:
          type: boolean
          description: "El registro está activo en el sistema"
        updated:
          type: string
          description: "Determina si el campo esta actualizado"
        updatedby:
          type: integer
          description: "Determina quien actualizó el campo"
        additionalvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
        referencedvalues:
          type: array
          items:
            $ref: './propertiesmap.yaml#/propertiesmap'
      required:
         - ad_client_id
         - ad_org_id
         - c_creditcardsettlement_id
         - c_perceptionssettlement_id
         - created
         - createdby
         - c_tax_id
         - internalno
         - isactive
         - updated
         - updatedby
