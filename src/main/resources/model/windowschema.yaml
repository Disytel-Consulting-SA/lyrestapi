components:
  schemas:

    WindowSchema:
      type: object
      properties:
        ad_window_id:
          type: integer
        name:
          type: string
        description:
          type: string
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/WindowSchemaTab'


    WindowSchemaTab:
      type: object
      properties:
        ad_tab_id:
          type: integer
        name:
          type: string
        description:
          type: string
        seqno:
          type: integer
        tablevel:
          type: integer
        parent_ad_tab_id:
          type: integer
        link_columnname:
          type: string
        ad_table_id:
          type: integer
        tablename:
          type: string
        data_endpoint:
          type: string
        whereclause:
          type: string
        orderbyclause:
          type: string
        isreadonly:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WindowSchemaField'


    WindowSchemaField:
      type: object
      properties:
        ad_field_id:
          type: integer
        name:
          type: string
        description:
          type: string
        seqno:
          type: integer
        isdisplayed:
          type: boolean

        ad_column_id:
          type: integer
        columnname:
          type: string
        ad_reference_id:
          type: integer
        ad_reference_value_id:
          type: integer
        ismandatory:
          type: boolean
        iskey:
          type: boolean
        isparent:
          type: boolean

        reference:
          $ref: '#/components/schemas/WindowSchemaReference'


    WindowSchemaReference:
      type: object
      properties:
        type:
          type: string
          description: Tipo semántico de referencia para el frontend
        endpoint:
          type: string
          description: Endpoint REST para recuperar los valores del lookup
        values:
          type: array
          items:
            $ref: '#/components/schemas/WindowSchemaReferenceValue'


    WindowSchemaReferenceValue:
      type: object
      properties:
        value:
          type: string
        name:
          type: string